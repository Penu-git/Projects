<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚚🚚🤗😴</title>
    <link rel="stylesheet" href="mobileView.css">
</head>
<body>

    <div id="mobileContainerDesigner">

        <div id="body">
            <div id="timeRemaining">
                <h1 id="timeDisplay">00:00:00:00</h1>
                <h1 id="title">Rock - Paper - Scissors</h1>
                <h1 id="Life">Life❤💖:<h1 id="lifeNumber"></h1></h1>
            </div>
           <audio src="audio.mp3" id="gameSound" autoplay></audio>
           
            <div id="newestDisplay">

                <div>
                    <button class="Btn" id="Rock" value="Rock" onclick="RockBtnClick()">👊</button>
                    <button class="Btn" id="Paper" value="Paper" onclick="PaperBtnClick()">✋</button>
                    <button class="Btn" id="Scissors" value="Scissors" onclick="ScissorsBtnClick()">✌</button>
                </div>
                
                <div id="USER">
                    <h2 class="option" id="PLAYER">PLAYER:</h2>
                    <h2 class="option" id="Computer">Computer:</h2>
                
                    <h1 id="result"></h1>
                </div>
                <div id="manty">
                    <h3 id="PlyScore">Player Score:</h3>
                    <h3 id="ComScore">Computer Score:</h3>
                    <h1 id="Finalresult"></h1>
                </div>

            </div>
        
        </div>
        

    </div>

<script src="mobileFuntion.js"></script>
</body>
</html>
